<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRAI Systems — AI Product Studio | Built for India</title>
    <meta name="description" content="SRAI Systems is an AI product studio in Pune, India. Eight products built in-house — FundOS for founders, SmartBhoomi for farmers, and more — plus AI engineering for other companies.">
    <meta name="author" content="SRAI Systems" />
    <meta name="theme-color" content="#1a1f35" />

    <!--
      NO hardcoded <link rel="canonical"> and NO hardcoded og:url may live in this
      file. Every route is served from this same shell, so a canonical here is an
      explicit instruction to Google that every page is a duplicate of the
      homepage — which is exactly how all 16 sitemap URLs collapsed into one.

      Canonical, og:* and twitter:* are emitted PER ROUTE by scripts/prerender.mjs
      into the %SEO% slot below. Absence of a canonical is neutral; a wrong one
      de-indexes the site.
    -->
    <!--%SEO%-->

    <!--
      Google Search Console verification.
      Uncomment and paste the token from Search Console > Add property > HTML tag.
      (Alternatively verify by DNS TXT record, which survives redeploys.)
    -->
    <!-- <meta name="google-site-verification" content="PASTE_TOKEN_HERE" /> -->
  </head>

  <body>
    <div id="root"><!--%APP%--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
